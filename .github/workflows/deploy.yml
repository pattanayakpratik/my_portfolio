name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # 1. CI: Quality, Test & Build Verification (Runs on main, dev & PRs)
  # =========================================================================
  verify:
    name: CI / Lint, Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run automated test suite (Node + Python)
        run: npm test

      - name: Run production build
        run: npm run build

  # =========================================================================
  # 2. CD: Automatic Deployment (Runs on push to main or manual dispatch)
  # =========================================================================
  deploy:
    name: CD / Deploy to Production (Vercel)
    needs: verify
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_htbzpxDp5Ql7HbtTVKjLP6E0' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_z3Vbz5nTqyyw0yBg2EBt7LhjgAhr' }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel Production Deploy Hook..."
            response=$(curl -s -w "\n%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "Deploy Hook Response ($http_code): $body"
            if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
              echo "::error::Deploy hook failed with HTTP $http_code"
              exit 1
            fi
            echo "Deployment triggered successfully via Deploy Hook!"
          elif [ -n "$VERCEL_TOKEN" ]; then
            echo "Installing Vercel CLI..."
            npm install --global vercel@latest

            echo "Pulling Vercel production environment..."
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN

            echo "Building project artifacts with Vercel..."
            vercel build --prod --token=$VERCEL_TOKEN

            echo "Deploying prebuilt artifacts to Vercel Production..."
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            echo "================================================================="
            echo "✔ CI Build & Quality Checks Verified for main branch."
            echo "✔ Automated CD: Vercel is connected natively via the Vercel GitHub App"
            echo "  (https://pattanayakpratik.vercel.app)."
            echo "✔ Production deployment triggers automatically via Vercel GitHub Integration."
            echo "================================================================="
          fi
